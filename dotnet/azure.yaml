# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: agentic-design-patterns
services:
    chapter02-routing:
        project: ./src/Chapter02.Routing.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter02.Routing.Hosted.csproj
        displayName: Chapter 02 - Routing
        description: Routes travel bookings and information questions to specialists; bookings are simulated.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter02.Routing.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter02-routing
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter03-parallelization:
        project: ./src/Chapter03.Parallelization.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter03.Parallelization.Hosted.csproj
        displayName: Chapter 03 - Parallelization
        description: Runs parallel specialist tasks on a request and synthesizes their results.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter03.Parallelization.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter03-parallelization
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter04-reflection:
        project: ./src/Chapter04.Reflection.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter04.Reflection.Hosted.csproj
        displayName: Chapter 04 - Reflection
        description: Generates content, obtains an independent structured review, and refines within a fixed limit.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter04.Reflection.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter04-reflection
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter05-tool-use:
        project: ./src/Chapter05.ToolUse.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter05.ToolUse.Hosted.csproj
        displayName: Chapter 05 - Tool Use
        description: Selects and invokes a narrow lookup or calculator function to answer caller requests.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter05.ToolUse.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter05-tool-use
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter06-planning:
        project: ./src/Chapter06.Planning.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter06.Planning.Hosted.csproj
        displayName: Chapter 06 - Planning
        description: Builds a bounded plan for a topic and writes a concise summary that follows it.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter06.Planning.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter06-planning
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter07-multi-agent:
        project: ./src/Chapter07.MultiAgent.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter07.MultiAgent.Hosted.csproj
        displayName: Chapter 07 - Multi-Agent
        description: Runs one caller-selected multi-agent collaboration scenario per request.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter07.MultiAgent.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter07-multi-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter07-researcher:
        project: ./src/Chapter07.MultiAgent.Distributed
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter07.MultiAgent.Distributed.csproj
        displayName: Chapter 07 - Research specialist
        description: Produces research notes from general model knowledge for the distributed crew.
        uses:
            - mvp-playground-foundry-proj
        env:
            Distributed__Role: researcher
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter07.MultiAgent.Distributed.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter07-researcher
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter07-writer:
        project: ./src/Chapter07.MultiAgent.Distributed
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter07.MultiAgent.Distributed.csproj
        displayName: Chapter 07 - Writing specialist
        description: Writes an article grounded in caller-supplied research notes.
        uses:
            - mvp-playground-foundry-proj
        env:
            Distributed__Role: writer
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter07.MultiAgent.Distributed.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter07-writer
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter07-orchestrator:
        project: ./src/Chapter07.MultiAgent.Distributed
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter07.MultiAgent.Distributed.csproj
        displayName: Chapter 07 - Distributed orchestrator
        description: Calls the remote research specialist, then passes its notes to the remote writing specialist.
        uses:
            - mvp-playground-foundry-proj
        env:
            Distributed__Role: orchestrator
            Distributed__ResearcherEndpoint: ${CHAPTER07_RESEARCHER_ENDPOINT}
            Distributed__WriterEndpoint: ${CHAPTER07_WRITER_ENDPOINT}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter07.MultiAgent.Distributed.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter07-orchestrator
        protocols:
            - protocol: responses
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
