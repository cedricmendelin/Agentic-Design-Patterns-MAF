# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: agentic-design-patterns
services:
    chapter02-routing:
        project: ./src/Chapter02.Routing.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter02.Routing.Hosted.csproj
        displayName: Chapter 02 - Routing
        description: Routes travel bookings and information questions to specialists; bookings are simulated.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter02.Routing.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter02-routing
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter03-parallelization:
        project: ./src/Chapter03.Parallelization.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter03.Parallelization.Hosted.csproj
        displayName: Chapter 03 - Parallelization
        description: Runs parallel specialist tasks on a request and synthesizes their results.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter03.Parallelization.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter03-parallelization
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter04-reflection:
        project: ./src/Chapter04.Reflection.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter04.Reflection.Hosted.csproj
        displayName: Chapter 04 - Reflection
        description: Generates content, obtains an independent structured review, and refines within a fixed limit.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter04.Reflection.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter04-reflection
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter05-tool-use:
        project: ./src/Chapter05.ToolUse.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter05.ToolUse.Hosted.csproj
        displayName: Chapter 05 - Tool Use
        description: Selects and invokes a narrow lookup or calculator function to answer caller requests.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter05.ToolUse.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter05-tool-use
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter06-planning:
        project: ./src/Chapter06.Planning.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter06.Planning.Hosted.csproj
        displayName: Chapter 06 - Planning
        description: Builds a bounded plan for a topic and writes a concise summary that follows it.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter06.Planning.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter06-planning
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter07-multi-agent:
        project: ./src/Chapter07.MultiAgent.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter07.MultiAgent.Hosted.csproj
        displayName: Chapter 07 - Multi-Agent
        description: Runs one caller-selected multi-agent collaboration scenario per request.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter07.MultiAgent.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter07-multi-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter07-researcher:
        project: ./src/Chapter07.MultiAgent.Distributed
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter07.MultiAgent.Distributed.csproj
        displayName: Chapter 07 - Research specialist
        description: Produces research notes from general model knowledge for the distributed crew.
        uses:
            - mvp-playground-foundry-proj
        env:
            Distributed__Role: researcher
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter07.MultiAgent.Distributed.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter07-researcher
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter07-writer:
        project: ./src/Chapter07.MultiAgent.Distributed
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter07.MultiAgent.Distributed.csproj
        displayName: Chapter 07 - Writing specialist
        description: Writes an article grounded in caller-supplied research notes.
        uses:
            - mvp-playground-foundry-proj
        env:
            Distributed__Role: writer
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter07.MultiAgent.Distributed.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter07-writer
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter07-orchestrator:
        project: ./src/Chapter07.MultiAgent.Distributed
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter07.MultiAgent.Distributed.csproj
        displayName: Chapter 07 - Distributed orchestrator
        description: Calls the remote research specialist, then passes its notes to the remote writing specialist.
        uses:
            - mvp-playground-foundry-proj
        env:
            Distributed__Role: orchestrator
            Distributed__ResearcherEndpoint: ${CHAPTER07_RESEARCHER_ENDPOINT}
            Distributed__WriterEndpoint: ${CHAPTER07_WRITER_ENDPOINT}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter07.MultiAgent.Distributed.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter07-orchestrator
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter08-memory:
        project: ./src/Chapter08.Memory.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter08.Memory.Hosted.csproj
        displayName: Chapter 08 - Memory
        description: Demonstrates managed memory with synthetic travel facts recalled in a new MAF session and a fresh scope per request.
        uses:
            - mvp-playground-foundry-proj
        env:
            Foundry__ProjectEndpoint: ${AZURE_AI_PROJECT_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            AZURE_AI_EMBEDDING_DEPLOYMENT_NAME: text-embedding-3-large
            AZURE_AI_MEMORY_STORE_ID: chapter08-hosted-memory
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter08.Memory.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        kind: hosted
        name: chapter08-memory
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter09-learning-adaptation:
        project: ./src/Chapter09.LearningAdaptation.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter09.LearningAdaptation.Hosted.csproj
        displayName: Chapter 09 - Learning and Adaptation
        description: Evaluates a bounded prompt proposal against a fixed benchmark; changes require review.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter09.LearningAdaptation.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter09-learning-adaptation
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter10-mcp:
        project: ./src/Chapter10.MCP.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter10.MCP.Hosted.csproj
        displayName: Chapter 10 - MCP
        description: Uses a configured remote MCP server through Microsoft Agent Framework.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            CHAPTER10_MCP_SERVER_URL: ${CHAPTER10_MCP_SERVER_URL}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter10.MCP.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter10-mcp
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter11-goal-setting-monitoring:
        project: ./src/Chapter11.GoalSettingMonitoring.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter11.GoalSettingMonitoring.Hosted.csproj
        displayName: Chapter 11 - Goal Setting and Monitoring
        description: Generates a code artifact and monitors its progress against caller-defined goals within a fixed iteration budget.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter11.GoalSettingMonitoring.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter11-goal-setting-monitoring
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter12-exception-handling:
        project: ./src/Chapter12.ExceptionHandling.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter12.ExceptionHandling.Hosted.csproj
        displayName: Chapter 12 - Exception Handling and Recovery
        description: Retries a transient precise-location lookup failure and falls back to general-area information.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter12.ExceptionHandling.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter12-exception-handling
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter16-resource-optimization:
        project: ./src/Chapter16.ResourceOptimization.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter16.ResourceOptimization.Hosted.csproj
        displayName: Chapter 16 - Resource Optimization
        description: Routes each request to an appropriate model deployment and uses Foundry web search for current information.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            Foundry__ModelDeployments__fast: ${FOUNDRY_MODEL_DEPLOYMENT_FAST}
            Foundry__ModelDeployments__reasoning: ${FOUNDRY_MODEL_DEPLOYMENT_REASONING}
            Foundry__ModelDeployments__quality: ${FOUNDRY_MODEL_DEPLOYMENT_QUALITY}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter16.ResourceOptimization.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter16-resource-optimization
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter18-guardrails:
        project: ./src/Chapter18.Guardrails.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter18.Guardrails.Hosted.csproj
        displayName: Chapter 18 - Guardrails
        description: Screens caller requests with a structured policy evaluator before allowing the assistant to respond.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter18.Guardrails.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter18-guardrails
        protocols:
            - protocol: responses
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
