# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: agentic-design-patterns
services:
    decision-models:
        project: ./src/DecisionModels.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project DecisionModels.Hosted.csproj
        displayName: Decision Models
        description: Typed support decisions and deterministic review gates before specialist generation.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            Foundry__ModelDeployments__decision: Decision-1
            Foundry__ModelDeployments__openaiDecision: gpt-6-luna
            Decisions__Provider: microsoft
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: DecisionModels.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: decision-models
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter02-routing:
        project: ./src/Chapter02.Routing.Hosted
        host: azure.ai.agent
