# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.35.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
name: agentic-design-patterns
services:
    chapter02-routing:
        project: ./src/Chapter02.Routing.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter02.Routing.Hosted.csproj
        displayName: Chapter 02 - Routing
        description: Routes travel bookings and information questions to specialists; bookings are simulated.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter02.Routing.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter02-routing
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter03-parallelization:
        project: ./src/Chapter03.Parallelization.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter03.Parallelization.Hosted.csproj
        displayName: Chapter 03 - Parallelization
        description: Runs parallel specialist tasks on a request and synthesizes their results.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter03.Parallelization.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter03-parallelization
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter04-reflection:
        project: ./src/Chapter04.Reflection.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter04.Reflection.Hosted.csproj
        displayName: Chapter 04 - Reflection
        description: Generates content, obtains an independent structured review, and refines within a fixed limit.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter04.Reflection.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter04-reflection
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter05-tool-use:
        project: ./src/Chapter05.ToolUse.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter05.ToolUse.Hosted.csproj
        displayName: Chapter 05 - Tool Use
        description: Selects and invokes a narrow lookup or calculator function to answer caller requests.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter05.ToolUse.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter05-tool-use
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter06-planning:
        project: ./src/Chapter06.Planning.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter06.Planning.Hosted.csproj
        displayName: Chapter 06 - Planning
        description: Builds a bounded plan for a topic and writes a concise summary that follows it.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter06.Planning.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter06-planning
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter08-memory:
        project: ./src/Chapter08.Memory.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter08.Memory.Hosted.csproj
        displayName: Chapter 08 - Memory
        description: Demonstrates managed memory with synthetic travel facts recalled in a new MAF session and a fresh scope per request.
        uses:
            - mvp-playground-foundry-proj
        env:
            Foundry__ProjectEndpoint: ${AZURE_AI_PROJECT_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            AZURE_AI_EMBEDDING_DEPLOYMENT_NAME: text-embedding-3-large
            AZURE_AI_MEMORY_STORE_ID: chapter08-hosted-memory
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter08.Memory.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        kind: hosted
        name: chapter08-memory
        protocols:
            - protocol: responses
              version: 2.0.0
    chapter09-learning-adaptation:
        project: ./src/Chapter09.LearningAdaptation.Hosted
        host: azure.ai.agent
        language: csharp
        startupCommand: dotnet run --project Chapter09.LearningAdaptation.Hosted.csproj
        displayName: Chapter 09 - Learning and Adaptation
        description: Evaluates a bounded prompt proposal against a fixed benchmark; changes require review.
        uses:
            - mvp-playground-foundry-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: Chapter09.LearningAdaptation.Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: chapter09-learning-adaptation
        protocols:
            - protocol: responses
              version: 2.0.0
    mvp-playground-foundry-proj:
        host: azure.ai.project
        endpoint: https://mvp-playground-foundry.services.ai.azure.com/api/projects/mvp-playground-foundry-proj
infra:
    provider: microsoft.foundry
