name: Live Foundry branch smoke tests

on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: Same-repository branch name or full commit SHA to test
        required: true
        type: string
      framework:
        description: Framework for live smoke tests
        required: true
        type: choice
        default: net11.0
        options:
          - net11.0
          - net10.0
      smoke_filter:
        description: Optional additional dotnet test filter
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Require default-branch workflow
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Dispatch this workflow on the default branch; use test_ref for the code under test."
          exit 1
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve immutable test commit
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_REF: ${{ inputs.test_ref }}
        run: |
          sha=$(node .github/scripts/foundry-branch-checks.mjs resolve)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}" >> "$GITHUB_STEP_SUMMARY"

  deterministic:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build and test without Foundry credentials
        run: |
          dotnet restore dotnet/AgenticDesignPatterns.slnx
          dotnet build dotnet/AgenticDesignPatterns.slnx --configuration Release --no-restore
          dotnet test dotnet/AgenticDesignPatterns.slnx --configuration Release --no-build --filter "Category!=LiveFoundry"

  protection:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify branch-test environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/foundry-branch-checks.mjs environment

  live:
    name: Live Foundry on ${{ needs.resolve.outputs.sha }}
    needs: [resolve, deterministic, protection]
    runs-on: ubuntu-latest
    environment:
      name: foundry-branch-integration
      url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build test commit
        run: dotnet build dotnet/AgenticDesignPatterns.slnx --configuration Release
      - name: Run live Foundry smoke tests
        env:
          Foundry__ProjectEndpoint: ${{ secrets.BRANCH_FOUNDRY_PROJECT_ENDPOINT }}
          Foundry__ApiKey: ${{ secrets.BRANCH_FOUNDRY_API_KEY }}
          Foundry__ModelDeployment: ${{ secrets.BRANCH_FOUNDRY_MODEL_DEPLOYMENT }}
          SMOKE_FILTER: ${{ inputs.smoke_filter }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          test -n "$Foundry__ProjectEndpoint" || { echo "::error::Missing BRANCH_FOUNDRY_PROJECT_ENDPOINT."; exit 1; }
          test -n "$Foundry__ApiKey" || { echo "::error::Missing BRANCH_FOUNDRY_API_KEY."; exit 1; }
          test -n "$Foundry__ModelDeployment" || { echo "::error::Missing BRANCH_FOUNDRY_MODEL_DEPLOYMENT."; exit 1; }
          case "$FRAMEWORK" in net10.0|net11.0) ;; *) echo "::error::Invalid framework"; exit 1 ;; esac
          filter="Category=LiveFoundry"
          if [ -n "$SMOKE_FILTER" ]; then
            filter="${filter}&${SMOKE_FILTER}"
          fi
          dotnet test dotnet/tests/Foundry.SmokeTests/Foundry.SmokeTests.csproj --framework "$FRAMEWORK" --configuration Release --no-build --filter "$filter"
